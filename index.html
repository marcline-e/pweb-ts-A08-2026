<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Antrian RS</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #fff; color: #111; }
    main { max-width: 1200px; margin: 32px auto; padding: 0 20px; }
    .navbar { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:18px 24px; border-bottom:1px solid #ddd; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:24px; }
    .card { background:#f4f4f2; border-radius:24px; padding:24px; margin-bottom:20px; }
    .input, select { box-sizing:border-box; padding:12px 16px; border:1px solid #ddd; border-radius:999px; background:#fff; max-width:100%; }
    input, select { font:inherit; }
    .btn { border:1px solid #111; border-radius:999px; padding:10px 16px; cursor:pointer; background:#fff; color:#111; }
    .btn-primary { background:#e6f7b2; border-color:#e6f7b2; }
    .btn-danger { color:#b42323; border-color:#b42323; }
    .btn-outline { background:transparent; }
    .badge { display:inline-block; border-radius:999px; padding:5px 9px; background:#e6f7b2; font-size:12px; }
    .muted { color:#777; }
    .stack { display:flex; flex-direction:column; gap:12px; }
    .inline { display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
    .queue-item, .ticket-item { background:#fff; border-radius:16px; padding:14px; margin-top:10px; }
    .queue-item { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
    .message { min-height:24px; margin:10px 0; }
    .error { color:#b42323; }
    .success { color:#246b32; }
    .ticket-list { margin-top:12px; }
    h1, h2, h3 { font-weight:400; }
    label { display:block; margin-bottom:6px; }
    @media(max-width:760px) { .grid { grid-template-columns:1fr; } .navbar { align-items:flex-start; flex-direction:column; } }
  </style>
  <script type="module" src="dist/pages/index.js" defer></script>
</head>
<body>
  <header class="navbar">
    <div>
      <strong>Antrian Rumah Sakit</strong>
      <span class="muted"> / Admin Dashboard</span>
    </div>
    <div class="inline">
      <span id="staffInfo">Memuat sesi...</span>
      <a href="operator.html">Panel Operator</a>
      <button id="logoutButton" class="btn btn-outline" type="button">Logout</button>
    </div>
  </header>

  <main>
    <h1>Kelola <em>antrian</em></h1>
    <p class="muted">Kelola jenis layanan dan penerbitan tiket secara langsung.</p>
    <p id="globalMessage" class="message" role="status" aria-live="polite"></p>

    <div class="grid">
      <section class="card">
        <h2>Jenis Antrian</h2>
        <form id="queueTypeForm" class="stack">
          <div>
            <label for="queueCode">Kode (satu huruf A–Z)</label>
            <input class="input" id="queueCode" name="code" maxlength="1" pattern="[A-Z]" required placeholder="Contoh: J">
          </div>
          <div>
            <label for="queueName">Nama jenis antrian</label>
            <input class="input" id="queueName" name="name" required maxlength="60" placeholder="Contoh: JANTUNG">
          </div>
          <button class="btn btn-primary" type="submit">Tambah jenis antrian</button>
        </form>
        <div id="queueTypeMessage" class="message" role="status" aria-live="polite"></div>
        <div id="queueTypesList"></div>
      </section>

      <section class="card">
        <h2>Terbitkan Tiket Manual</h2>
        <form id="ticketForm" class="stack">
          <div>
            <label for="ticketQueueType">Jenis antrian aktif</label>
            <select class="input" id="ticketQueueType" required></select>
          </div>
          <div>
            <label for="ticketPriority">Prioritas</label>
            <select class="input" id="ticketPriority" required>
              <option value="normal">Normal</option>
              <option value="lansia">Lansia</option>
              <option value="disabilitas">Disabilitas</option>
              <option value="vip">VIP</option>
            </select>
          </div>
          <button id="issueButton" class="btn btn-primary" type="submit">Terbitkan tiket</button>
        </form>
        <div id="ticketMessage" class="message" role="status" aria-live="polite"></div>
        <div id="ticketsList"></div>
        <hr>
        <button id="resetButton" class="btn btn-danger" type="button">Reset seluruh antrian</button>
      </section>
    </div>
  </main>
</body>
</html>
